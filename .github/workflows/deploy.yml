name: Deploy to GitHub Pages

# main 是唯一的分支：推上去就自動測試、建置、部署。
# 手機重新整理就會拿到最新版（資產檔名帶 hash，不會吃到舊快取）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型別檢查
        run: npm run typecheck

      - name: 測試（core/ 規則層 + UI 接線）
        run: npm test

      # build_maps.mjs 同時是**地圖驗證器**（§13.4）：任一張圖驗證失敗即以非零碼結束。
      # 之後的 git diff 再確認資料檔與統計摘要都是最新的。
      - name: 地圖驗證 + 資料檔與產生器一致
        run: |
          npm run map:build
          git diff --exit-code -- src/data/maps docs/map-stats.md

      - name: 建置
        run: npx vite build
        env:
          VITE_BUILD_ID: ${{ github.sha }}

      # Pages 已在 repo 設定為「GitHub Actions」來源，這裡只需要讀設定。
      # （GITHUB_TOKEN 沒有建立 Pages site 的權限，enablement 會失敗。）
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 部署完再去線上抓一次，確認手機重新整理真的會拿到「這一次」的建置。
  # 曾經發生 GitHub 內建的 legacy Jekyll builder 跟這個 workflow 搶著部署、
  # 結果線上被換成 repo 根目錄的未建置原始碼（index.html 還指著 /src/main.ts）。
  # 那種情況以前是靜悄悄的，現在會讓 CI 直接變紅。
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: 線上健檢
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          SHA="${GITHUB_SHA:0:7}"
          echo "檢查 $URL 是否為 build $SHA"
          for i in $(seq 1 10); do
            HTML=$(curl -fsSL "$URL?cb=$i$RANDOM" || true)
            ASSET=$(printf '%s' "$HTML" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            if [ -n "$ASSET" ] && curl -fsSL "$URL$ASSET" | grep -q "$SHA"; then
              echo "✅ 線上版本 = $SHA（$ASSET）"
              exit 0
            fi
            echo "  第 $i 次：尚未更新（asset='$ASSET'），等 CDN…"
            sleep 15
          done
          echo "::error::線上頁面不是這次的建置。到 Settings → Pages 確認 Source 是 GitHub Actions（不是 Deploy from a branch）。"
          exit 1
