<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b0e12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230d1013'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%234fd6ff'/%3E%3C/svg%3E"
    />
    <title>複製人 PMC — 廢棄水處理廠</title>
  </head>
  <body>
    <!-- 地圖是滿版底層，HUD 與控制列全部半透明浮在上面。 -->
    <div id="app">
      <canvas id="map"></canvas>

      <header id="hud">
        <div class="hud-row hud-top">
          <div class="chip" id="hud-clock" title="世界時刻（§5）"></div>
          <div class="chip" id="hud-hp"></div>
          <div class="chip" id="hud-weapon"></div>
          <div class="chip" id="hud-stance"></div>
          <div class="chip" id="hud-roster"></div>
          <div class="chip" id="hud-foes"></div>
        </div>
        <div class="hud-row hud-ledger" id="hud-ledger"></div>
      </header>

      <div id="turn-banner" class="hidden"></div>

      <!-- 右上工具列：一橫排。刻意不往下堆 —— 往下堆會在地圖右緣蓋住格子，
           而鏡頭的垂直夾制只保得住 HUD 底部以下、控制列頂部以上那一段（§12.8）。 -->
      <div id="top-right">
        <button id="btn-recenter" type="button" class="hidden" title="鏡頭回到士兵">◎</button>
        <button id="btn-tapmove" type="button" title="點地圖尋路移動（開／關）">走</button>
        <button id="btn-log" type="button" title="戰鬥紀錄">誌</button>
      </div>

      <section id="tile-menu" class="sheet hidden" aria-live="polite"></section>
      <section id="log-panel" class="sheet hidden"></section>

      <footer id="controls">
        <!-- 左：移動區。取消斜向後空出四格，剩下的按鈕放大。
             待機是這一區唯一不可逆的動作，獨立在方向盤上方、隔一個按鈕高度。 -->
        <div id="move-cluster">
          <button type="button" data-act="WAIT" class="btn-wait">待機</button>
          <div id="dpad">
            <span class="pad-blank"></span>
            <button type="button" data-dir="N">↑</button>
            <button type="button" data-act="STANCE"><b id="lbl-stance">蹲</b></button>
            <button type="button" data-dir="W">←</button>
            <button type="button" data-dir="S">↓</button>
            <button type="button" data-dir="E">→</button>
          </div>
        </div>

        <!-- 右：動作區。開火鍵已刪除，射擊一律透過地圖點擊。 -->
        <div id="actions">
          <div id="skill-menu" class="hidden"></div>
          <button type="button" data-act="SKILL"><b>技能</b></button>
          <button type="button" data-act="RELOAD"><b>彈</b><small id="lbl-reload">1</small></button>
          <button type="button" data-act="SWAP"><b>換</b><small id="lbl-swap">—</small></button>
        </div>
      </footer>
    </div>

    <div id="modal-root" class="hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
